kind = "web"
previewPath = "/"
title = "FCC Fore-City Construction"
version = "1.0.0"
id = "artifacts/fcc-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25881

[services.development]
run = "pnpm --filter @workspace/fcc-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fcc-website", "run", "build" ]
publicDir = "artifacts/fcc-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25881"
BASE_PATH = "/"
